name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Release version in semver form, without a leading v
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Resolve release version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="$(python3 -c 'import json; print(json.load(open("plugins/bitdrift-cli/plugin.json", encoding="utf-8"))["version"])')"

          if [[ -n "$REQUESTED_VERSION" && "$REQUESTED_VERSION" != "$version" ]]; then
            echo "Requested version $REQUESTED_VERSION does not match manifest version $version." >&2
            exit 1
          fi

          python3 scripts/release_versions.py "$version" --check
          echo "value=$version" >> "$GITHUB_OUTPUT"

          if git show-ref --verify --quiet "refs/tags/v$version"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Tag v$version already exists; skipping release."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install latest GitHub CLI
        if: steps.version.outputs.publish == 'true'
        run: |
          type -p curl >/dev/null || sudo apt-get update
          type -p curl >/dev/null || sudo apt-get install -y curl
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | \
            sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | \
            sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y gh
          gh --version

      - name: Publish skills release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh skill publish --tag "v$RELEASE_VERSION"
